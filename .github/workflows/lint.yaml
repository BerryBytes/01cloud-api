name: 1. Lint Workflow
on:
  push:
    branches:
      - feature/**
      - feat/**
      - fix/**
      - fixes/**
      - hotfix/**
      - refactor/**
      - enhance/**
      - test/**
jobs:
  lint:
    name: Lint
    secrets: inherit
    uses: BerryBytes/workflows/.github/workflows/lint.yaml@main
  test:
    name: Test
    secrets: inherit
    uses: BerryBytes/workflows/.github/workflows/test.yaml@main