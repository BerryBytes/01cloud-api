repos:
  # ==========================================
  # Pre-commit default hooks
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-vcs-permalinks
      - id: check-symlinks
      - id: destroyed-symlinks
      #- id: pretty-format-json

  # ==========================================
  # Golang hooks
  # ==========================================
  # - repo: https://github.com/TekWizely/pre-commit-golang
  #   rev: v1.0.0-rc.1
  #   hooks:
  #     - id: go-fmt
  #       args: [-w]
  #     - id: go-mod-tidy

  # ==========================================
  # Codespell
  # ==========================================
  # - repo: https://github.com/codespell-project/codespell
  #   rev: v2.2.5
  #   hooks:
  #     - id: codespell
  #       files: ^.*\.(py|c|h|md|rst|yml|go|sh|sql|tf|yaml)$
  #       args: ["--ignore-words-list", "hist,nd,datas,MOrg,requred,applcations,connnect,uniterrupted,deativation,Tiggered,notifiation,Resloved,projet,fileds,stroage,occured,quering,Downlaod,templete,envirnoment,stoage,responsess,deactive,credintials,revison,curent,requestor,donot,compatibililty,enviroment,lastest,completd,acceses,CIMetric,uknown,atleast,initilize"]
  # ==========================================
  # Gitleaks
  # ==========================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks
        args: ["detect", "--verbose"]

  # ==========================================
  # FIXED STYLELINT HOOK (No nodeenv)
  # ==========================================
  - repo: local
    hooks:
      - id: stylelint
        name: stylelint
        entry: npx stylelint --fix
        language: system
        types: [css, scss]
        exclude: "node_modules/|dist/|build/"

  # ==========================================
  # Trivy Security Scanner
  # ==========================================
  - repo: local
    hooks:
      - id: trivy-fs
        name: trivy fs scan
        entry: bash -c 'if [ "$GITHUB_ACTIONS" = "true" ]; then echo "Skipping Trivy in CI"; exit 0; else trivy fs . --skip-dirs vendor --scanners misconfig,secret --exit-code 1; fi'
        language: system
        pass_filenames: false
